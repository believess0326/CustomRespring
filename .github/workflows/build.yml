name: Build Roothide Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos & Roothide SDK
        run: |
          # 1. 安装基础依赖
          sudo apt-get update
          sudo apt-get install -y build-essential perl libssl-dev clang llvm make zip unzip jq
          
          # 2. 克隆 Roothide 专用版 Theos
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomRespring-Roothide-DEB
          path: packages/*.deb

name: Build Roothide Tweak

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Homebrew Dependencies
        run: |
          brew install dpkg ldid

      - name: Setup Roothide Theos & SDK
        run: |
          git clone --recursive https://github.com/roothide/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* ~/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomRespring-Roothide-DEB
          path: packages/*.deb
